<!DOCTYPE html>
<html>
<head>
  <title>Driver Salary Claim</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="formHeader">Office Expense Reimbursement Claim</h1>
  </header>

  <form>
    <!-- Category Selection -->
    <label for="category">Select Category:</label>
    <select id="category" name="category" onchange="updateHeader()">
      <option value="driver">Driver Salary</option>
      <option value="car">Car Maintenance</option>
    </select>
    <br><br>

    <!-- Date -->
    <label for="date">Date:</label>
    <input type="date" id="date" name="date">
    <br><br>

    <!-- Invoice Number -->
    <label for="invoice">Invoice Number:</label>
    <input type="text" id="invoice" name="invoice" maxlength="40" pattern="[A-Za-z0-9]+" required>
    <br><br>

    <!-- Driver Name -->
    <label for="driverName">Driver Name:</label>
    <input type="text" id="driverName" name="driverName" required>
    <br><br>

    <!-- Salary Month -->
    <label for="month">Salary Month:</label>
    <input type="text" id="month" name="month" placeholder="e.g. July 2026">
    <br><br>

    <!-- Salary Amount -->
    <label for="amount">Driver Salary Amount (₹):</label>
    <input type="number" id="amount" name="amount" placeholder="e.g. 18000">
    <br><br>

    <!-- Mode of Payment -->
    <label for="payment">Mode of Payment:</label>
    <select id="payment" name="payment">
      <option>Cash</option>
      <option>Bank Transfer</option>
      <option>NEFT</option>
      <option>IMPS</option>
    </select>
    <br><br>

    <button type="submit">Submit</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
