<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office Expense Claim & Reimbursement Form</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1a252f; border-bottom: 2px solid #0056b3; padding-bottom: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    .hint { font-size: 0.75em; color: #666; margin-top: 3px; }
    .radio-group { display: flex; gap: 20px; margin-bottom: 20px; }
    .radio-group label { font-weight: normal; cursor: pointer; }
    .btn { background: #0056b3; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; font-weight: bold; }
    .btn-print { background: #28a745; margin-left: 10px; }
    
    /* Print Layout Styling */
    @media print {
      .no-print { display: none !important; }
      body { background: white; margin: 0; }
      .container { box-shadow: none; border: 2px solid #000; padding: 20px; width: 100%; max-width: 100%; }
      input, select, textarea { border: none; background: transparent; font-weight: bold; padding: 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Office Expense Reimbursement Claim</h2>

  <div class="form-group no-print">
    <label>Select Category:</label>
    <div class="radio-group">
      <label><input type="radio" name="category" value="salary" checked onclick="toggleCategory()"> Driver Salary</label>
      <label><input type="radio" name="category" value="maintenance" onclick="toggleCategory()"> Car Maintenance</label>
    </div>
  </div>

  <form id="claimForm">
    <div class="form-group">
      <label for="date">Date of Expense / Payment:</label>
      <input type="date" id="date" required>
    </div>

    <div class="form-group">
      <label for="invoiceNo">Invoice Number (Alpha-Numeric, Max 40 Chars):</label>
      <input type="text" id="invoiceNo" maxlength="40" pattern="[a-zA-Z0-9]+" title="Only letters and numbers allowed (max 40 characters)" placeholder="e.g. DS2026INV0001928374" required>
      <div class="hint no-print">Alpha-numeric characters only. Strictly up to 40 characters.</div>
    </div>

    <!-- DRIVER SALARY SPECIFIC ATTRIBUTES -->
    <div id="salarySection">
      <div class="form-group">
        <label for="month">Salary Month:</label>
        <select id="month">
          <option>January 2026</option>
          <option>February 2026</option>
          <option>March 2026</option>
          <option>April 2026</option>
          <option>May 2026</option>
          <option>June 2026</option>
          <option>July 2026</option>
          <option>August 2026</option>
          <option>September 2026</option>
          <option>October 2026</option>
          <option>November 2026</option>
          <option>December 2026</option>
        </select>
      </div>

      <div class="form-group">
        <label for="salary">Driver Salary Amount (₹):</label>
        <input type="number" id="salary" placeholder="e.g. 18000">
      </div>
    </div>

    <!-- CAR MAINTENANCE SPECIFIC ATTRIBUTES -->
    <div id="maintSection" style="display: none;">
      <div class="form-group">
        <label for="vendor">Vendor / Garage Name:</label>
        <input type="text" id="vendor" placeholder="e.g. City Auto Service Center">
      </div>

      <div class="form-group">
        <label for="maintDesc">Maintenance / Repair Details:</label>
        <input type="text" id="maintDesc" placeholder="e.g. Oil change, brake pad replacement">
      </div>

      <div class="form-group">
        <label for="maintAmount">Maintenance Amount (₹):</label>
        <input type="number" id="maintAmount" placeholder="e.g. 4500">
      </div>
    </div>

    <div class="form-group">
      <label for="paymentMode">Mode of Payment:</label>
      <select id="paymentMode">
        <option>Bank Transfer / NEFT / IMPS</option>
        <option>UPI / GPay / PhonePe</option>
        <option>Cash</option>
        <option>Cheque</option>
        <option>Demand Draft (DD)</option>
      </select>
    </div>

    <div class="form-group no-print" style="margin-top: 30px;">
      <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Print Claim Sheet / Save as PDF</button>
    </div>
  </form>
</div>

<script>
  function toggleCategory() {
    const isSalary = document.querySelector('input[name="category"]:checked').value === 'salary';
    document.getElementById('salarySection').style.display = isSalary ? 'block' : 'none';
    document.getElementById('maintSection').style.display = isSalary ? 'none' : 'block';
  }

  // Enforce strict 40-character alphanumeric limit on Invoice input
  document.getElementById('invoiceNo').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 40);
  });
</script>

</body>
</html>
